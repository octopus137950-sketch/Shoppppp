    <script>

        const SUPABASE_URL = "https://pqnplszpsepdnznrurex.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbnBsc3pwc2VwZG56bnJ1cmV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjY3MjYsImV4cCI6MjA5NjY0MjcyNn0.Z0eXpBKor6uD3PogDX6xXuYJRYh0o997EeHYhEU4ATA";

        // เพื่อให้โค้ดทำงานได้ เราจะดึงข้อมูลแถวแรกมาทดสอบ หรือระบุค่าว่างไว้ก่อน
        const testUserId = null; 

        // 2. ฟังก์ชันกดลิงก์แล้วบันทึกลงฐานข้อมูล Supabase ก่อนส่งไปร้านค้า
        async function recordClick(storeName, targetUrl) {
            alert(`กำลังบันทึกประวัติการช้อปที่ ${storeName} และเตรียมส่งคุณไปยังร้านค้า...`);
            
            try {
                // บันทึกข้อมูลลงตาราง click_logs ที่เราสร้างไว้ใน Supabase
                const { data, error } = await supabase
                    .from('click_logs')
                    .insert([
                        { 
                            store_name: storeName, 
                            affiliate_url: targetUrl
                        }
                    ]);

                if (error) throw error;

                // เมื่อบันทึกสำเร็จ ให้เปิดลิงก์ร้านค้าทันที
                window.location.href = targetUrl;
            } catch (error) {
                console.error('Error:', error.message);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล แต่ระบบจะพาท่านไปยังร้านค้า: ' + error.message);
                window.location.href = targetUrl;
            }
        }
    </script>
